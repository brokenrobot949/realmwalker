const $ = id => document.getElementById(id);

function setView(v) { ui.view = v; render(); }

function render() {
  renderHeader();
  renderNav();
  const views = { keep: renderKeep, tavern: renderTavern, commissions: renderCommissions, reliquary: renderReliquary, campaigns: renderCampaigns, roster: renderRoster, inventory: renderInventory };
  $('view').innerHTML = views[ui.view]();
  renderModal();
  renderDrawer();
}

function renderHeader() {
  const chips = [];
  state.activeMissions.forEach(m => chips.push(`<span class="chip">⚔ <b>${esc(m.name)}</b> <span class="cd" data-cd="${m.end}"></span></span>`));
  state.training.forEach(t => { const h = heroById(t.heroId); if (h) chips.push(`<span class="chip">🎓 <b>${esc(h.name.split(' ')[0])}</b> <span class="cd" data-cd="${t.end}"></span></span>`); });
  state.rests.forEach(r => { const h = heroById(r.heroId); if (h) chips.push(`<span class="chip">🛌 <b>${esc(h.name.split(' ')[0])}</b> <span class="cd" data-cd="${r.end}"></span></span>`); });
  state.heroes.forEach(h => { if (h.status === 'injured') chips.push(`<span class="chip">🩹 <b>${esc(h.name.split(' ')[0])}</b> <span class="cd" data-cd="${h.injuredUntil}"></span></span>`); });
  const awaitingSpec = livingHeroes().filter(h => specsOwed(h) > 0).length;
  if (awaitingSpec) chips.push(`<span class="chip" style="cursor:pointer" title="Heroes with an unspent milestone choice" onclick="A.setView('roster')">⭐ <b>${awaitingSpec}</b> await specialization</span>`);
  $('header').innerHTML = `
    <div class="brand">⚜ LFG<small>${state.guildName ? esc(state.guildName) : 'guildmaster'}</small>${state.guildName ? `<small style="font-size:10px; color:var(--muted)">${esc(guildRank().name)}</small>` : ''}</div>
    <div class="goldbox">${coin(16)} ${num(state.gold)}</div>
    <div class="timers">${chips.join('') || '<span class="chip">All quiet — everyone is home.</span>'}</div>
    <button class="ghost" onclick="A.openCodex()" title="Guild Codex — how to play">?</button>
    <button class="ghost" onclick="A.toggleDrawer()">📜 Chronicle</button>`;
}

function renderNav() {
  const tabs = [['keep', `${icon('castle',16)} Keep`], ['tavern', `${icon('tankard',16)} Tavern`], ['commissions', `${icon('crossedswords',16)} Commissions`], ['reliquary', `${icon('reliquary',16)} Reliquary`], ['campaigns', `${icon('book',16)} Campaigns`], ['roster', `${icon('helm',16)} Roster`], ['inventory', `${icon('satchel',16)} Inventory`]];
  $('nav').innerHTML = tabs.map(([k, label]) =>
    `<button class="${ui.view === k ? 'active' : ''}" onclick="A.setView('${k}')">${label}</button>`).join('');
}

/* ---------- hero card bits ---------- */
function marksHtml(h) {
  let s = '';
  for (let i = 0; i < CFG.MAX_MARKS; i++) s += i < h.marks ? '<span class="red">●</span>' : '<span style="color:#4a4234">○</span>';
  return `<span class="marks" title="Injury marks — ${CFG.MAX_MARKS} means death">${s}</span>`;
}

function heroStatusHtml(h) {
  switch (h.status) {
    case 'idle': return '<span class="green">Ready</span>';
    case 'mission': {
      const m = state.activeMissions.find(m => m.heroIds.includes(h.id));
      return m ? `<span class="blue">On “${esc(m.name)}”</span> <span class="cd" data-cd="${m.end}"></span>` : 'On a mission';
    }
    case 'training': {
      const t = state.training.find(t => t.heroId === h.id);
      return t ? `<span class="blue">Training</span> <span class="cd" data-cd="${t.end}"></span>` : 'Training';
    }
    case 'resting': {
      const r = state.rests.find(r => r.heroId === h.id);
      return r ? `<span class="yellow">Resting</span> <span class="cd" data-cd="${r.end}"></span>` : 'Resting';
    }
    case 'injured': return `<span class="red">Injured</span> <span class="cd" data-cd="${h.injuredUntil}"></span>`;
    case 'dead': return `<span class="red">${icon('fallen', 14)} Fallen</span>`;
    case 'retired': {
      const w = KEEP_WINGS[h.post];
      return `<span class="gold-t">🎖 The Old Guard${w ? ` — ${esc(w.name)}` : ''}</span>`;
    }
  }
  return h.status;
}

// colored pill showing a hero's Potential grade (falls back to Rooted if missing)
function potentialBadge(h) {
  const p = POTENTIAL[h.potential] || POTENTIAL.rooted;
  return `<span class="tag" style="color:${p.color}; border-color:${p.color}">${esc(p.name)}</span>`;
}
// small tags for a hero's traits, colored by tone; '' if none
const TRAIT_TONE_COLOR = { good: '#7fb069', bad: '#d1604f', mixed: '#e0b84c' };
// single trait's tag markup — shared by traitTags() (hero/recruit cards) and the
// Tavern's trait-explanation box, so both render tags identically
function traitTagHtml(t) {
  const col = TRAIT_TONE_COLOR[t.tone] || 'var(--muted)';
  const warn = t.tone === 'good' ? '' : '⚠ ';
  return `<span class="tag" style="color:${col}; border-color:${col}" title="${esc(t.desc)}">${warn}${esc(t.name)}</span>`;
}
function traitTags(h) {
  const ts = heroTraits(h);
  return ts.length ? ts.map(traitTagHtml).join(' ') : '';
}
// gold ⭐ tags for a hero's chosen specializations — visually distinct from trait tags
function specTags(h) {
  const ss = heroSpecs(h);
  return ss.length ? ss.map(s =>
    `<span class="tag" style="color:var(--gold); border-color:var(--gold)" title="${esc(s.desc)}">⭐ ${esc(s.name)}</span>`).join(' ') : '';
}

function heroCard(h, actions) {
  const c = CLASSES[h.cls];
  const need = xpToNext(h.level);
  const xpBar = h.level >= CFG.LEVEL_CAP
    ? '<div class="sub">Max level</div>'
    : `<div class="bar"><div style="width:${Math.min(100, h.xp / need * 100)}%"></div></div>
       <div class="sub">${num(h.xp)} / ${num(need)} XP</div>`;
  return `<div class="card">
    <div class="spread">
      <div><b>${esc(h.name)}</b> <span class="sub">Lv ${h.level}</span></div>
      <div><span class="tag ${c.role}">${ROLE_ICON[c.role]} ${h.cls}</span></div>
    </div>
    <div class="spread" style="margin-top:2px">
      <span class="sub">Rating <b class="rating">${num(heroRating(h))}</b> · ${potentialBadge(h)}${h.spark ? ` <span class="sub">+${h.spark}</span>` : ''}</span>
      ${marksHtml(h)}
    </div>
    ${xpBar}
    <div style="margin:4px 0">${heroStatusHtml(h)}</div>
    ${powerLineHtml(h)}
    ${traitTags(h) ? `<div style="margin-top:4px">${traitTags(h)}</div>` : ''}
    ${specTags(h) ? `<div style="margin-top:4px">${specTags(h)}</div>` : ''}
    ${relicLineHtml(h)}
    ${actions ? `<div class="row" style="margin-top:8px">${actions}</div>` : ''}
  </div>`;
}

// one-line summary of a hero's class power
function powerLineHtml(h) {
  const p = heroPower(h);
  return p ? `<div class="ability"><b>${esc(p.name)}:</b> ${esc(p.desc)}</div>` : '';
}

// one-line summary of a hero's equipped relic (or nothing)
function relicLineHtml(h) {
  const r = heroRelic(h);
  if (!r) return '';
  const t = RELICS[r.key];
  const ch = t.ward ? ` <span class="sub">(${r.charges}/${t.ward})</span>` : '';
  return `<div class="ability"><span class="${'q-' + r.tier}">${relicIcon(r.key,15)} ${esc(t.name)}</span>${ch} — <span class="sub">${relicEffectText(r.key)}</span></div>`;
}

// compact one-line relic summary for tight spaces (e.g. the party picker)
function relicCompactHtml(h) {
  const r = heroRelic(h);
  if (!r) return '';
  const t = RELICS[r.key];
  const ch = t.ward ? ` (${r.charges}/${t.ward})` : '';
  return `<div class="sub"><span class="${'q-' + r.tier}">${relicIcon(r.key,14)} ${esc(t.name)}</span>${ch} — ${relicEffectText(r.key)}</div>`;
}

function heroActions(h) {
  if (h.status === 'retired') return ''; // mentors are honored, not managed — no actions at all
  const acts = [];
  // outstanding milestone choices are deferrable, so keep the prompt prominent
  if (h.status !== 'dead' && specsOwed(h) > 0)
    acts.push(`<button class="act" onclick="A.openSpecPicker(${h.id})">⭐ Choose specialization${specsOwed(h) > 1 ? ` (${specsOwed(h)})` : ''}</button>`);
  if (h.status === 'idle') {
    if (state.training.length < trainSlots())
      acts.push(`<button class="act" onclick="A.assignTraining(${h.id})">🎓 Train</button>`);
    if (h.marks > 0)
      acts.push(`<button class="act" onclick="A.assignRest(${h.id})">🛌 Rest (${restHoursTxt()}h)</button>`);
  }
  if (h.status === 'training')
    acts.push(`<button class="ghost" onclick="A.recallTraining(${h.id})">Recall from training</button>`);
  if (h.status === 'resting')
    acts.push(`<button class="ghost" onclick="A.cancelRest(${h.id})">Cancel rest (no benefit)</button>`);
  if (h.marks > 0 && h.status !== 'dead') {
    const cost = infirmaryCost(h);
    acts.push(`<button class="act" ${state.gold < cost ? 'disabled' : ''} onclick="A.healMark(${h.id})">⚕ Heal mark — ${num(cost)}g</button>`);
  }
  // relic management is allowed unless the hero is out on a mission
  if (h.status !== 'mission' && h.status !== 'dead') {
    acts.push(`<button class="ghost" onclick="A.openEquipHero(${h.id})">${heroRelic(h) ? '🎽 Change relic' : '🎽 Equip relic'}</button>`);
  }
  // a veteran at the cap may take a permanent mentor post instead of adventuring on
  if (canHangUpSword(h)) {
    acts.push(`<button class="act" onclick="A.askMentor(${h.id})">🎖 Hang up the sword</button>`);
  }
  // can dismiss only heroes who aren't currently committed to something
  if (h.status === 'idle' || h.status === 'injured') {
    acts.push(`<button class="ghost" onclick="A.askDismiss(${h.id})">👋 Dismiss</button>`);
  }
  return acts.join('');
}

/* ---------- relic display helpers ---------- */
// card glow class for a relic tier ('' for the ordinary tiers)
const tierGlow = tier => tier === 'mythic' ? ' mythic-glow' : (tier === 'legendary' ? ' legendary-glow' : '');
function relicEffectText(key) {
  const t = RELICS[key], bits = [];
  if (t.rating) bits.push(`+${t.rating} rating`);
  if (t.partyRating) bits.push(`+${t.partyRating} party rating`);
  if (t.success) bits.push(`+${pct(t.success)} party success`);
  if (t.gold) bits.push(`+${pct(t.gold)} mission gold`);
  if (t.xp) bits.push(`+${pct(t.xp)} bearer XP`);
  if (t.partyXp) bits.push(`+${pct(t.partyXp)} party XP`);
  if (t.injuryReduce) bits.push(`−${pct(1 - t.injuryReduce)} bearer injury chance`);
  if (t.duration) bits.push(`−${pct(1 - t.duration)} mission duration`);
  if (t.ward) bits.push(`blocks ${t.ward} injur${t.ward > 1 ? 'ies' : 'y'}, then breaks`);
  if (t.revive) bits.push('survives a lethal wound once, then breaks');
  if (t.wardParty) bits.push('whole party immune to injury for one mission, then breaks');
  return bits.join(' · ');
}
function relicCard(r, actions, opts) {
  const t = RELICS[r.key];
  const bearer = r.equippedBy ? heroById(r.equippedBy) : null;
  const ch = t.ward ? ` <span class="sub">(${r.charges}/${t.ward} charges)</span>` : '';
  const glow = tierGlow(t.tier);
  return `<div class="card${glow}">
    <div class="spread">
      <b class="${'q-' + t.tier}">${relicIcon(r.key,18)} ${esc(t.name)}</b>
      <span class="tag q-${t.tier}">${RELIC_TIERS[t.tier].name}</span>
    </div>
    <div class="ability">${relicEffectText(r.key)}${ch}</div>
    <div class="flavor">${esc(t.flavor)}</div>
    ${opts && opts.hideBearer ? '' : (bearer ? `<div class="sub">Equipped by <b>${esc(bearer.name)}</b></div>` : '<div class="sub">Unequipped</div>')}
    ${actions ? `<div class="row" style="margin-top:8px">${actions}</div>` : ''}
  </div>`;
}

/* ---------- guild tabard ---------- */
// Renders a heater-shield tabard as an inline SVG. `t` is {pattern,c1,c2,emblem} or
// null (renders a muted placeholder). A counter keeps clipPath ids unique across calls
// so two tabards rendered on the same page (e.g. Keep card + editor preview) don't collide.
let tabardClipCounter = 0;
const TABARD_SHIELD_PATH = 'M8 6 H92 V48 C92 78 50 104 50 104 C50 104 8 78 8 48 Z';
function tabardSvg(t, size) {
  const d = t || { pattern: 'solid', c1: '#3d3524', c2: '#3d3524', emblem: '' };
  const clipId = 'tabardClip' + (++tabardClipCounter);
  let fill;
  switch (d.pattern) {
    case 'pale':    fill = `<rect x="0" y="0" width="50" height="110" fill="${d.c1}"/><rect x="50" y="0" width="50" height="110" fill="${d.c2}"/>`; break;
    case 'fess':    fill = `<rect x="0" y="0" width="100" height="55" fill="${d.c1}"/><rect x="0" y="55" width="100" height="55" fill="${d.c2}"/>`; break;
    case 'bend':    fill = `<rect x="0" y="0" width="100" height="110" fill="${d.c1}"/><polygon points="0,0 100,0 100,110" fill="${d.c2}"/>`; break;
    case 'chevron': fill = `<rect x="0" y="0" width="100" height="110" fill="${d.c1}"/><polygon points="0,110 50,55 100,110" fill="${d.c2}"/>`; break;
    case 'quarter': fill = `<rect x="0" y="0" width="50" height="55" fill="${d.c1}"/><rect x="50" y="0" width="50" height="55" fill="${d.c2}"/><rect x="0" y="55" width="50" height="55" fill="${d.c2}"/><rect x="50" y="55" width="50" height="55" fill="${d.c1}"/>`; break;
    case 'paly':    fill = `<rect x="0" y="0" width="100" height="110" fill="${d.c1}"/><rect x="25" y="0" width="25" height="110" fill="${d.c2}"/><rect x="75" y="0" width="25" height="110" fill="${d.c2}"/>`; break;
    case 'cross':   fill = `<rect x="0" y="0" width="100" height="110" fill="${d.c1}"/><rect x="40" y="0" width="20" height="110" fill="${d.c2}"/><rect x="0" y="40" width="100" height="20" fill="${d.c2}"/>`; break;
    case 'bordure': fill = `<rect x="0" y="0" width="100" height="110" fill="${d.c2}"/><rect x="14" y="14" width="72" height="82" fill="${d.c1}"/>`; break;
    case 'saltire': fill = `<rect x="0" y="0" width="100" height="110" fill="${d.c1}"/><polygon points="0,0 18,0 100,92 100,110 82,110 0,18" fill="${d.c2}"/><polygon points="82,0 100,0 100,18 18,110 0,110 0,92" fill="${d.c2}"/>`; break;
    default:        fill = `<rect x="0" y="0" width="100" height="110" fill="${d.c1}"/>`; // solid
  }
  return `<svg viewBox="0 0 100 110" width="${size}" height="${Math.round(size * 1.1)}" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="${clipId}"><path d="${TABARD_SHIELD_PATH}"/></clipPath></defs>
    <g clip-path="url(#${clipId})">${fill}</g>
    <path d="${TABARD_SHIELD_PATH}" fill="none" stroke="#0d0b08" stroke-width="3"/>
    ${d.emblem ? `<text x="50" y="52" text-anchor="middle" dominant-baseline="central" font-size="34">${d.emblem}</text>` : ''}
  </svg>`;
}

// cosmetic unlock gating — compares each table's minRank against the guild's current rank
const patternUnlocked = key => TABARD_PATTERNS[key].minRank <= rankIdx();
const colorUnlocked = i => TABARD_COLOR_MIN_RANK[i] <= rankIdx();
const emblemUnlocked = i => TABARD_EMBLEM_MIN_RANK[i] <= rankIdx();

// renown & guild rank card — shown on the Keep, directly under the guild card
function renownCardHtml() {
  const idx = rankIdx(), rank = guildRank(), nr = nextRank();
  let html = `<div class="card">
    <div>${icon('renown')} Renown <b>${num(state.renown)}</b> · <b class="gold-t">${esc(rank.name)}</b></div>`;
  if (nr) {
    const filled = clamp((state.renown - rank.at) / (nr.at - rank.at) * 100, 0, 100);
    const nextIdx = idx + 1;
    const unlockPatterns = Object.values(TABARD_PATTERNS).filter(p => p.minRank === nextIdx).length;
    const unlockColors = TABARD_COLOR_MIN_RANK.filter(m => m === nextIdx).length;
    const unlockEmblemIdx = TABARD_EMBLEM_MIN_RANK.map((m, i) => m === nextIdx ? i : -1).filter(i => i >= 0);
    const bits = [];
    if (unlockPatterns) bits.push(`${unlockPatterns} pattern${unlockPatterns > 1 ? 's' : ''}`);
    if (unlockColors) bits.push(`${unlockColors} color${unlockColors > 1 ? 's' : ''}`);
    if (unlockEmblemIdx.length) bits.push(`${unlockEmblemIdx.length} emblem${unlockEmblemIdx.length > 1 ? 's' : ''} (${unlockEmblemIdx.map(i => TABARD_EMBLEMS[i]).join(' ')})`);
    html += `<div class="bar"><div style="width:${filled}%"></div></div>
      <div class="sub">${esc(nr.name)} at ${num(nr.at)} renown${bits.length ? ` — Unlocks: ${bits.join(', ')}` : ''}</div>`;
  } else {
    html += `<div class="sub">The realm knows no higher honor.</div>`;
  }
  html += '</div>';
  return html;
}

// legacy / prestige card — shown on the Keep, directly under the renown card.
// Hidden entirely until the final campaign is beaten (or a charter has already
// been retired), so it doesn't clutter a first playthrough that can't use it yet.
function legacyCardHtml() {
  const lg = state.legacy;
  if (lg.ascensions === 0 && !charterEligible()) return '';
  let html = `<div class="card">
    <div class="spread">
      <div>⚜ Charter <b>${roman(lg.ascensions + 1)}</b> · Legacy points: <b class="gold-t">${num(lg.points)}</b></div>
      <div class="row">
        <button class="ghost" onclick="A.openLegacy()">⚜ Legacy perks</button>
        ${charterEligible() ? '<button class="act" onclick="A.askRetire()">🏆 Retire the Charter</button>' : ''}
      </div>
    </div>`;
  html += '</div>';
  return html;
}

/* ---------- Keep ---------- */
// Compact "who keeps this wing" line for wingCard — posts filled, and what each
// mentor in residence contributes.
function mentorLineHtml(key) {
  const slots = mentorSlots(key), here = mentorsAt(key);
  if (!slots) return `<div class="sub" style="margin-top:6px">🎖 Posts unlock at wing level ${CFG.MENTOR_SLOT_LEVELS[0]}</div>`;
  const who = here.map(h => `${esc(h.name.split(' ')[0])} <span class="gold-t">${esc(mentorDescFor(key, h))}</span>`).join(', ');
  return `<div class="sub" style="margin-top:6px">🎖 Mentors: <b>${here.length}/${slots}</b>${who ? ` — ${who}` : ''}</div>`;
}

// One wing's upgrade card: name + level pips, the current effect, and either the
// next level's effect with its buy button or a fully-upgraded note. `extra` holds
// the live operational block that belongs with the wing (roster count, coffers…).
function wingCard(key, extra) {
  const w = KEEP_WINGS[key], lvl = wingLevel(key), max = CFG.KEEP_WING_MAX, cost = wingCost(key);
  return `<div class="card">
    <div class="spread">
      <div>
        <div>${icon(w.icon, 16)} <b>${esc(w.name)}</b>
          <span class="sub">Lv ${lvl} / ${max}</span>
          <span class="gold-t">${'●'.repeat(lvl)}</span><span class="sub">${'○'.repeat(max - lvl)}</span></div>
        <div class="sub">${esc(w.effectText(lvl))}</div>
      </div>
      <div style="text-align:right">
        ${cost === null
          ? '<div class="sub">Fully upgraded — nothing left to build here.</div>'
          : `<div class="sub">Lv ${lvl + 1}: ${esc(w.effectText(lvl + 1))}</div>
             <button class="act" ${state.gold < cost ? 'disabled' : ''} onclick="A.upgradeWing('${key}')">Upgrade — ${num(cost)}g</button>`}
      </div>
    </div>
    ${mentorLineHtml(key)}
    ${extra || ''}
    <div class="flavor">${esc(w.flavor)}</div>
  </div>`;
}

function renderKeep() {
  let html = `<h2>🏰 The Keep — ${esc(keepTitle())}</h2>
  <div class="flavor" style="margin-bottom:10px">Home ground — where your banner hangs, the coffers fill, and the wounded are made whole again.</div>
  <div class="card">
    <div class="spread">
      <div class="row">
        ${tabardSvg(state.tabard, 44)}
        <div>Guild: <b class="gold-t">${state.guildName ? esc(state.guildName) : 'Unnamed'}</b></div>
      </div>
      <div class="row">
        <button class="ghost" onclick="A.openTabard()">🎨 ${state.tabard ? 'Edit' : 'Design'} tabard</button>
        <button class="ghost" onclick="A.openRename()">✍ Rename guild — ${num(CFG.GUILD_RENAME_COST)}g</button>
      </div>
    </div>
  </div>`;

  // Great Hall — houses the roster
  html += wingCard('hall', `<div style="margin-top:8px">Roster: <b>${livingHeroes().length} / ${rosterCap()}</b> heroes</div>`);

  // Treasury — passive income accrues over time; click to collect (merged with its upgrade)
  const accrued = accruedIncome(Date.now());
  html += wingCard('treasury', `<div class="spread" style="margin-top:8px">
    <div>${coin(15)} <b class="gold-t"><span data-income>${num(accrued)}</span>g</b> waiting
      <span class="sub">(${num(incomeRate())}g/hour, holds up to ${incomeCapH()} hours)</span></div>
    <button class="act" ${accrued ? '' : 'disabled'} onclick="A.collectIncome()">Collect</button>
  </div>`);

  // renown & guild rank
  html += renownCardHtml();

  // legacy / prestige
  html += legacyCardHtml();

  // training
  html += `<h3>${icon('crossedswords',16)} Training Yard <span class="sub">(${state.training.length} / ${trainSlots()} slots in use — starts ${num(trainingRateAt(0))} XP/hr, ramps to ${num(trainingRateAt(CFG.TRAINING_CAP_H))} XP/hr over ${CFG.TRAINING_CAP_H}h — the longer they train, the faster they learn)</span></h3>`;
  html += wingCard('yard');
  const now = Date.now();
  state.training.forEach(t => {
    const h = heroById(t.heroId);
    if (!h) return;
    html += `<div class="card"><div class="spread">
      <div><b>${esc(h.name)}</b> <span class="sub">Lv ${h.level} ${h.cls}</span> — earned <b class="blue">${num(trainingXpSoFar(t, now))} XP</b> so far <span class="sub">(now ${num(trainingRateAt((now - t.start) / H))} XP/hr)</span></div>
      <div class="row"><span class="cd" data-cd="${t.end}"></span>
      <button class="ghost" onclick="A.recallTraining(${h.id})">Recall</button></div>
    </div></div>`;
  });
  for (let i = state.training.length; i < trainSlots(); i++) {
    html += `<div class="card"><div class="spread"><span class="empty">Empty training slot</span>
      <button class="act" ${idleHeroes().length ? '' : 'disabled'} onclick="A.openHeroPicker('train')">Assign hero</button></div></div>`;
  }

  // rest
  html += `<h3>${icon('bed',16)} Barracks <span class="sub">(${restHoursTxt()}h of rest — removes one injury mark, earns nothing)</span></h3>`;
  html += wingCard('barracks');
  if (state.rests.length === 0) html += '<div class="empty">No one is resting.</div>';
  state.rests.forEach(r => {
    const h = heroById(r.heroId);
    if (!h) return;
    html += `<div class="card"><div class="spread">
      <div><b>${esc(h.name)}</b> <span class="sub">Lv ${h.level} ${h.cls}</span> ${marksHtml(h)}</div>
      <div class="row"><span class="cd" data-cd="${r.end}"></span>
      <button class="ghost" onclick="A.cancelRest(${h.id})">Cancel</button></div>
    </div></div>`;
  });
  const restable = idleHeroes().filter(h => h.marks > 0);
  html += `<div style="margin:6px 0 0"><button class="act" ${restable.length ? '' : 'disabled'} onclick="A.openHeroPicker('rest')">Send a hero to rest</button>
    ${restable.length ? '' : '<span class="sub"> — no idle heroes carry injury marks</span>'}</div>`;

  // infirmary
  const infDisc = 1 - infirmaryMult(); // live discount, wing + mentors, after the floor
  html += `<h3>${icon('mortar',16)} Infirmary <span class="sub">(pay gold to remove a mark instantly — ${num(CFG.INFIRMARY_BASE_COST)}g + ${num(CFG.INFIRMARY_COST_PER_LEVEL)}g per hero level${infDisc ? `, less ${pct(infDisc)}` : ''})</span></h3>`;
  html += wingCard('infirmary');
  const marked = state.heroes.filter(h => h.status !== 'dead' && h.status !== 'retired' && h.marks > 0);
  if (!marked.length) html += '<div class="empty">No heroes carry injury marks. The Infirmary is quiet.</div>';
  marked.forEach(h => {
    const cost = infirmaryCost(h);
    html += `<div class="card"><div class="spread">
      <div><b>${esc(h.name)}</b> <span class="sub">Lv ${h.level} ${h.cls}</span> ${marksHtml(h)}
        ${h.marks === CFG.MAX_MARKS - 1 ? '<span class="red"> — one wound from death!</span>' : ''}</div>
      <button class="act" ${state.gold < cost ? 'disabled' : ''} onclick="A.healMark(${h.id})">Heal one mark — ${num(cost)}g</button>
    </div></div>`;
  });

  // hall of records — the guild's running tally of deeds
  html += hallOfRecordsHtml();
  return html;
}

// The Keep's closing section: a ledger of everything the guild has done.
// Display-only — nothing here is ever read back by the game math.
function hallOfRecordsHtml() {
  const r = state.records;
  const rows = [
    ['Missions won', r.missions],
    ['Gold earned', r.gold],
    ['Levels gained', r.levels],
    ['Heroes dismissed', r.dismissed],
    ['Mentors placed', r.mentors],
    ['Rounds bought', r.rounds],
    ['Relics acquired', r.relics],
  ];
  let html = `<h3>${icon('book',16)} Hall of Records <span class="sub">(the deeds of this charter, tallied)</span></h3>
  <div class="card">
    <div class="flavor" style="margin-bottom:8px">A clerk keeps the ledger by candlelight, and never once asks whether it was worth it.</div>`;
  rows.forEach(([label, v]) => {
    html += `<div class="spread"><span class="sub">${label}</span><b>${num(v)}</b></div>`;
  });
  html += `<hr class="thin">
    <div class="spread"><span>Turris Aeterna — highest floor cleared</span>
      <b class="gold-t">${r.towerBest ? num(r.towerBest) : '— never entered —'}</b></div>
    <div class="sub">This one record endures — it is carried into every charter that follows.</div>
  </div>`;
  return html;
}

/* ---------- Tavern ---------- */
function renderTavern() {
  let html = `<h2>🍺 The Tavern</h2>
  <div class="flavor" style="margin-bottom:10px">Ale, rumor, and restless blades for hire — every great guild is built from strangers who walked through this door.</div>
  <div class="spread"><h3 style="margin:0">Adventurers for Hire <span class="sub">(roster ${livingHeroes().length}/${rosterCap()} · new faces in <span class="cd" data-cd="${state.recruitsExpire}"></span>)</span></h3>
    <button class="tavern" ${state.gold < CFG.RECRUIT_REFRESH_COST ? 'disabled' : ''} onclick="A.payRefreshRecruits()">🍻 Buy a round — new faces (${num(CFG.RECRUIT_REFRESH_COST)}g)</button>
  </div><div class="grid" style="margin-top:8px">`;
  if (!state.recruits.length) html += '<div class="empty">The tavern is empty tonight.</div>';
  state.recruits.forEach((r, i) => {
    const c = CLASSES[r.cls];
    const full = livingHeroes().length >= rosterCap();
    html += `<div class="card">
      <div class="spread"><b>${esc(r.name)}</b> <span class="tag ${c.role}">${ROLE_ICON[c.role]} ${r.cls}</span></div>
      <div class="sub">Level ${r.level} · Rating <b class="rating">${num(heroRating(r))}</b> · ${potentialBadge(r)}${r.spark ? ` <span class="sub">+${r.spark}</span>` : ''}</div>
      ${powerLineHtml(r)}
      ${traitTags(r) ? `<div style="margin-top:4px">${traitTags(r)}</div>` : ''}
      ${specsOwed(r) > 0 ? `<div class="sub gold-t" style="margin-top:4px">⭐ ${specsOwed(r)} specialization${specsOwed(r) > 1 ? 's' : ''} to choose</div>` : ''}
      <div class="row" style="margin-top:8px">
        <button class="act" ${state.gold < r.cost || full ? 'disabled' : ''} onclick="A.recruitHero(${i})">Recruit — ${num(r.cost)}g</button>
        ${full ? '<span class="sub red">Roster full — upgrade the Great Hall</span>' : ''}
      </div>
    </div>`;
  });
  html += `</div>`;

  html += `<h3 style="color:var(--muted); letter-spacing:1px; text-transform:uppercase; font-size:13px; cursor:pointer; user-select:none; margin-top:14px" onclick="A.toggleTraitHelp()">${ui.traitHelp ? '▾' : '▸'} ❓ What do hero traits mean?</h3>`;
  if (ui.traitHelp) {
    const groups = [['good', 'Boons'], ['mixed', 'Mixed blessings'], ['bad', 'Drawbacks']];
    html += `<div class="card">
      <div class="sub">Every hero rolls 1–3 traits at creation — permanent quirks that fold automatically into mission math with no extra bookkeeping. Most are boons; a few come with a catch.</div>
      ${groups.map(([tone, label]) => {
        const ts = TRAIT_KEYS.map(k => TRAITS[k]).filter(t => t.tone === tone);
        if (!ts.length) return '';
        return `<div style="margin-top:10px">
          <div class="sub" style="text-transform:uppercase; letter-spacing:1px; font-size:11px">${esc(label)}</div>
          ${ts.map(t => `<div class="row" style="margin-top:4px">${traitTagHtml(t)}<span class="sub">${esc(t.desc)}</span></div>`).join('')}
        </div>`;
      }).join('')}
    </div>`;
  }
  return html;
}

/* ---------- Commissions (the job board) ---------- */
function renderCommissions() {
  let html = `<h2>📋 Commissions</h2>
  <div class="flavor" style="margin-bottom:10px">The board groans with work: bounties, escorts, and the dirty little jobs that keep a guild fed.</div>`;
  html += `<h3>📋 Commission Board <span class="sub">(repeatable practice missions — postings rotate over time)</span></h3>`;
  JOB_TIERS.forEach((tierName, tier) => {
    if (jobTierUnlocked(tier)) {
      const jobs = state.jobBoard.filter(j => j.tier === tier);
      if (!jobs.length) return;
      const collapsed = !!ui.jobCollapse[tier];
      html += `<h3 style="color:var(--muted); letter-spacing:1px; text-transform:uppercase; font-size:13px; cursor:pointer; user-select:none" onclick="A.toggleJobTier(${tier})">${collapsed ? '▸' : '▾'} ${tierName} <span class="sub">(${jobs.length})</span></h3>`;
      if (!collapsed) jobs.forEach(j => { html += missionRow(j, null); });
    } else {
      html += `<div class="card" style="opacity:.6"><div class="spread">
        <b style="color:var(--muted); letter-spacing:1px; text-transform:uppercase; font-size:13px">🔒 ${tierName}</b>
        <span class="sub">Unlocks when a hero reaches level ${CFG.JOB_TIER_MIN_LEVEL[tier]}</span></div></div>`;
    }
  });
  return html;
}

function missionRow(def, story, statusHtml) {
  const size = def.size || 4;
  const sizeMult = 1 + Math.max(0, size - 4) * CFG.PARTY_SIZE_REWARD_BONUS;
  const baseGold = Math.round(def.cr * CFG.GOLD_PER_CR * (story ? CFG.STORY_GOLD_MULT : 1) * sizeMult);
  const baseXp = Math.round(def.cr * CFG.XP_PER_CR * (story ? CFG.STORY_XP_MULT : 1) * sizeMult);
  const idle = idleHeroes();
  const canStaff = idle.filter(h => CLASSES[h.cls].role === 'tank').length >= 1 &&
                   idle.filter(h => CLASSES[h.cls].role === 'healer').length >= 1 &&
                   idle.filter(h => CLASSES[h.cls].role === 'dps').length >= 2 &&
                   idle.length >= size;
  const sizeTxt = size > 4 ? `<b class="gold-t">${size} heroes</b>` : `${size} heroes`;
  return `<div class="card">
    <div class="spread">
      <div>
        <b>${esc(def.name)}</b>
        <span class="sub"> · CR ${num(def.cr)} · ${fmtHours(def.hours)} · ${sizeTxt} · ~${num(baseGold)}g, ~${num(baseXp)} XP each</span>
        ${def.flavor ? `<div class="flavor">${esc(def.flavor)}</div>` : ''}
        ${def.expires ? `<div class="sub">Leaves the board in <span class="cd" data-cd="${def.expires}"></span></div>` : ''}
      </div>
      <div class="m-side" style="text-align:right; min-width:130px">
        ${statusHtml !== undefined ? statusHtml :
          `<button class="act" ${canStaff ? '' : 'disabled'} onclick='A.openPicker(${escAttr(JSON.stringify(JSON.stringify({ def: { name: def.name, cr: def.cr, hours: def.hours, size, flavor: def.flavor }, story })))})'>Send party</button>
           ${canStaff ? '' : `<div class="sub">Need ${size} ready (min 1 tank, 1 healer, 2 DPS)</div>`}`}
      </div>
    </div>
  </div>`;
}

/* ---------- Turris Aeterna (rendered under the campaigns) ---------- */
function towerCardHtml() {
  const last = campaignAt(CAMPAIGNS.length - 1); // name only — the count still comes from CAMPAIGNS
  if (!towerUnlocked()) {
    return `<div class="card" style="background:var(--panel2)">
      <div class="spread"><b style="color:var(--gold)">🔒 Turris Aeterna — The Eternal Tower</b>
      <span class="sub">Sealed</span></div>
      <div class="flavor">The gates of the Eternal Tower stand closed. They do not open for the untested.</div>
      <div class="sub">Complete “${esc(last.name)}” — every campaign to its last chapter — and the doors will know you.</div></div>`;
  }
  const floor = towerFloor();
  const def = {
    name: `Turris Aeterna Floor ${floor}`,
    cr: towerCR(floor), hours: CFG.TOWER_HOURS, size: CFG.TOWER_SIZE,
    flavor: 'The stair narrows, the air thins, and whatever waits on this landing has never been beaten.',
  };
  const inProgress = state.activeMissions.some(m => m.story && m.story.tower != null);
  let html = `<div class="card mythic-glow" style="background:var(--panel2)">
    <div class="spread"><b class="q-mythic">🏛 Turris Aeterna — The Eternal Tower</b>
    <span class="sub">${state.tower} floor${state.tower === 1 ? '' : 's'} cleared</span></div>
    <div class="flavor">The gates stand open at last, inviting the battle-worn to prove their worth. There is no summit — only the next floor.</div>
    <div class="sub">Each floor is ${pct(CFG.TOWER_STEP)} harder than the one below, and clearing it is the only way to earn a <b class="q-mythic">Mythic</b> relic — one guaranteed per floor. Fail and the same floor waits for you.</div></div>`;
  html += missionRow(def, { tower: floor }, inProgress ? '<span class="blue">Party in the field…</span>' : undefined);
  html += '<div style="height:14px"></div>';
  return html;
}

/* ---------- Campaigns ---------- */
function renderCampaigns() {
  let html = `<h2>📖 Campaigns</h2>
  <div class="flavor" style="margin-bottom:10px">The great threats of the age gather in the dark — and someone must answer them.</div>`;
  CAMPAIGNS.forEach((_base, c) => {
    const camp = campaignAt(c); // mechanics from CAMPAIGNS, name/desc/mission story from the active saga
    const unlocked = c === 0 || state.campaigns[c - 1] >= 5;
    const done = state.campaigns[c];
    if (!unlocked) {
      html += `<div class="card" style="background:var(--panel2)">
        <div class="spread"><b style="color:var(--gold)">🔒 ${esc(camp.name)}</b>
        <span class="sub">${camp.levelHint} · ${done}/5 complete</span></div>
        <div class="flavor">${esc(camp.desc)}</div></div>`;
      html += `<div class="empty" style="margin-bottom:14px">Complete “${esc(campaignAt(c - 1).name)}” to unlock.</div>`;
      return;
    }
    const collapsed = !!ui.campaignCollapse[c];
    html += `<div class="card" style="background:var(--panel2); cursor:pointer; user-select:none" onclick="A.toggleCampaign(${c})">
      <div class="spread"><b style="color:var(--gold)">${collapsed ? '▸' : '▾'} ${esc(camp.name)}</b>
      <span class="sub">${camp.levelHint} · ${done}/5 complete</span></div>
      <div class="flavor">${esc(camp.desc)}</div></div>`;
    if (collapsed) { html += '<div style="height:14px"></div>'; return; }
    camp.missions.forEach((_m, i) => {
      const mdef = campaignMission(c, i); // cr/hours/size from CAMPAIGNS, name/flavor from the active saga
      let statusHtml;
      const inProgress = state.activeMissions.some(m => m.story && m.story.c === c && m.story.i === i);
      if (i < done) statusHtml = '<span class="green">✓ Complete</span>';
      else if (inProgress) statusHtml = '<span class="blue">Party in the field…</span>';
      else if (i > done) statusHtml = '<span class="sub">🔒 Locked</span>';
      if (i === done && !inProgress) statusHtml = undefined; // renders Send party button
      // hide the name & flavor of not-yet-unlocked chapters — no spoilers, but keep the
      // planning stats (CR / duration / party size / reward estimates) visible
      const rowDef = i > done ? { ...mdef, name: `Chapter ${i + 1}: ???`, flavor: '' } : mdef;
      html += missionRow(rowDef, { c, i }, statusHtml);
    });
    html += '<div style="height:14px"></div>';
  });
  html += towerCardHtml();
  if (charterEligible()) {
    html += `<div class="card legendary-glow" style="background:var(--panel2)">
      <div class="spread"><b style="color:var(--gold)">⚜ Retire the Charter</b>
      <button class="act" onclick="A.askRetire()">🏆 Retire the Charter</button></div>
      <div class="flavor">${esc(finalBossName())} has fallen. Nothing remains but legend — and the next generation.</div></div>`;
  }
  return html;
}

/* ---------- Roster ---------- */
function renderRoster() {
  const living = livingHeroes();
  const dead = state.heroes.filter(h => h.status === 'dead');
  const roleCount = role => living.filter(h => CLASSES[h.cls].role === role).length;
  let html = `<h2>🗡 Roster <span class="sub">${living.length}/${rosterCap()} heroes</span></h2>
  <div class="flavor" style="margin-bottom:10px">Your people — grizzled veterans and wide-eyed greenhorns alike, each with a name worth remembering.</div>`;
  const awaiting = living.filter(h => specsOwed(h) > 0).length;
  if (awaiting) html += `<div class="sub" style="margin-bottom:10px">⭐ ${awaiting} hero${awaiting > 1 ? 'es await' : ' awaits'} specialization.</div>`;
  const tabs = [['all', `All (${living.length})`], ['tank', `🛡 Tanks (${roleCount('tank')})`],
                ['healer', `✚ Healers (${roleCount('healer')})`], ['dps', `⚔ DPS (${roleCount('dps')})`]];
  html += `<div class="row" style="margin-bottom:10px">` + tabs.map(([k, label]) =>
    `<button class="subtab ${ui.rosterTab === k ? 'active' : ''}" onclick="A.setRosterTab('${k}')">${label}</button>`).join('') + `</div>`;
  const order = { idle: 0, injured: 1, mission: 2, training: 3, resting: 4 };
  const shown = living.filter(h => ui.rosterTab === 'all' || CLASSES[h.cls].role === ui.rosterTab);
  if (!shown.length) {
    html += '<div class="empty">No heroes of this role. Recruit some at the Tavern.</div>';
  } else {
    html += '<div class="grid">';
    shown.slice().sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9) || b.level - a.level)
      .forEach(h => { html += heroCard(h, heroActions(h)); });
    html += '</div>';
  }
  // The Old Guard — mentors who hung up the sword. Always shown, like the Hall of the
  // Fallen, but honored rather than mourned (no dimming).
  const guard = state.heroes.filter(h => h.status === 'retired');
  if (guard.length) {
    html += `<h3 class="gold-t">🎖 The Old Guard <span class="sub">${guard.length} mentor${guard.length > 1 ? 's' : ''} in residence</span></h3>
      <div class="flavor" style="margin-bottom:8px">They no longer take the field. Their work now is making everyone who does a little harder to kill.</div>
      <div class="grid">`;
    guard.forEach(h => {
      const w = KEEP_WINGS[h.post];
      html += `<div class="card">
        <div class="spread"><b>${esc(h.name)}</b> <span class="tag">${h.cls}</span></div>
        <div class="sub" style="margin-top:2px">Lv ${h.level} · ${potentialBadge(h)}</div>
        <div class="ability">${w
          ? `${icon(w.icon, 15)} <b>${esc(w.name)}</b> — <span class="gold-t">${esc(mentorDescFor(h.post, h))}</span>`
          : 'Awaiting a post.'}</div>
      </div>`;
    });
    html += '</div>';
  }
  if (dead.length) {
    html += `<h3 class="red">${icon('fallen', 16)} Hall of the Fallen</h3><div class="grid">`;
    dead.forEach(h => {
      html += `<div class="card" style="opacity:.55"><div class="spread"><b>${esc(h.name)}</b>
        <span class="tag">${h.cls}</span></div>
        <div class="sub">Died at level ${h.level}. Remembered.</div></div>`;
    });
    html += '</div>';
  }
  return html;
}

/* ---------- Reliquary (relic shop) ---------- */
function renderReliquary() {
  const s = state.shop;
  let html = `<h2>⚱ The Reliquary <span class="sub">(fresh stock in <span class="cd" data-cd="${s.expires}"></span>)</span></h2>
  <div class="spread">
    <div class="sub" style="max-width:70%">The keeper deals in relics pulled from tombs, battlefields, and less mentionable places. One relic per hero — choose well.</div>
    <button class="ghost" ${state.gold < CFG.SHOP_REFRESH_COST ? 'disabled' : ''} onclick="A.refreshShopPaid()">Request new stock (${num(CFG.SHOP_REFRESH_COST)}g)</button>
  </div>`;
  if (!s.relics.length) { html += '<div class="empty">The shelves are bare. Come back when the keeper restocks.</div>'; return html; }
  html += '<div class="grid" style="margin-top:8px">';
  s.relics.forEach((entry, i) => {
    const t = RELICS[entry.key];
    const glow = tierGlow(t.tier);
    html += `<div class="card${glow}">
      <div class="spread"><b class="q-${t.tier}">${relicIcon(entry.key,18)} ${esc(t.name)}</b><span class="tag q-${t.tier}">${RELIC_TIERS[t.tier].name}</span></div>
      <div class="ability">${relicEffectText(entry.key)}</div>
      <div class="flavor">${esc(t.flavor)}</div>
      <div class="row" style="margin-top:8px"><button class="act" ${state.gold < entry.price ? 'disabled' : ''} onclick="A.buyRelic(${i})">Buy — ${num(entry.price)}g</button></div>
    </div>`;
  });
  html += '</div>';
  return html;
}

/* ---------- Inventory (relic management) ---------- */
function renderInventory() {
  const relics = state.relics;
  const openCount = relics.filter(r => !r.equippedBy).length;
  const equippedCount = relics.filter(r => r.equippedBy).length;
  let html = `<h2>🎒 Inventory <span class="sub">${relics.length} relic${relics.length !== 1 ? 's' : ''}</span></h2>
    <div class="flavor" style="margin-bottom:10px">Relics wrenched from tomb and battlefield, each waiting for the right hand to wake it.</div>
    <div class="sub" style="margin-bottom:10px">Each hero equips one relic; its effect applies automatically on missions. Consumable relics break when their charges run out.</div>
    <div class="row" style="margin-bottom:10px">
      <button class="subtab ${ui.invTab === 'open' ? 'active' : ''}" onclick="A.setInvTab('open')">🟢 Available (${openCount})</button>
      <button class="subtab ${ui.invTab === 'equipped' ? 'active' : ''}" onclick="A.setInvTab('equipped')">🎽 Equipped (${equippedCount})</button>
    </div>`;
  const order = { mythic: -1, legendary: 0, rare: 1, magic: 2, common: 3 };
  const filtered = relics.filter(r => ui.invTab === 'equipped' ? r.equippedBy : !r.equippedBy);
  const sorted = filtered.slice().sort((a, b) => order[a.tier] - order[b.tier]);
  if (!sorted.length) {
    html += ui.invTab === 'equipped'
      ? '<div class="empty">No relics equipped. Equip one from the Available tab.</div>'
      : '<div class="empty">No unequipped relics. Earn them on missions or buy them at the Reliquary.</div>';
    return html;
  }
  html += '<div class="grid">';
  sorted.forEach(r => {
    const acts = [];
    if (r.equippedBy) {
      const h = heroById(r.equippedBy);
      const locked = h && h.status === 'mission';
      acts.push(`<button class="ghost" ${locked ? 'disabled' : ''} onclick="A.unequipRelic(${r.id})">${locked ? 'On mission' : 'Unequip'}</button>`);
    } else {
      acts.push(`<button class="act" onclick="A.openEquip(${r.id})">Equip</button>`);
      acts.push(`<button class="ghost" onclick="A.sellRelic(${r.id})">Sell — ${num(relicSellValue(r))}g</button>`);
    }
    html += relicCard(r, acts.join(''));
  });
  html += '</div>';
  return html;
}

/* ---------- Modals ---------- */
function renderModal() {
  const root = $('modal-root');
  if (ui.naming) { root.innerHTML = guildModal(); focusGuildInput(); return; }
  if (ui.awayMsgs) { root.innerHTML = awayModal(); return; }
  if (state.briefings.length) { root.innerHTML = briefingModal(); return; }
  if (ui.dataModal) { root.innerHTML = dataModal(); return; }
  if (ui.codexModal) { root.innerHTML = codexModal(); return; }
  if (ui.tabardEditor) { root.innerHTML = tabardEditorModal(); return; }
  if (ui.legacyShop) { root.innerHTML = legacyShopModal(); return; }
  if (ui.confirmRetire) { root.innerHTML = retireModal(); return; }
  if (ui.confirmReset) { root.innerHTML = resetModal(); return; }
  if (ui.confirmDismiss != null) { root.innerHTML = dismissModal(); return; }
  if (ui.equipRelic != null) { root.innerHTML = equipRelicModal(); return; }
  if (ui.equipHero != null) { root.innerHTML = equipHeroModal(); return; }
  if (ui.specPicker != null) { root.innerHTML = specPickerModal(); return; }
  if (ui.mentorPicker != null) { root.innerHTML = mentorPickerModal(); return; }

}

// keep focus in the guild-name field without wiping what the user has typed
function focusGuildInput() {
  const el = $('guildNameInput');
  if (el && document.activeElement !== el) { el.focus(); el.selectionStart = el.value.length; }
}

function briefingModal() {
  const b = state.briefings[0];
  const more = state.briefings.length - 1;
  const banner = b.success
    ? '<div style="font-size:22px" class="green">✅ Mission Successful</div>'
    : '<div style="font-size:22px" class="red">❌ Mission Failed</div>';
  let body = `<div class="preview">
    <div class="row"><span>💰 Gold brought home: <b class="gold-t">${num(b.gold)}</b></span></div>
    <div class="row sub"><span>✨ Experience: ~${num(b.xpEach)} XP to each of the ${b.partySize} heroes${b.success ? '' : ' (reduced — the mission failed)'}</span></div>
    <div class="row"><span class="gold-t">${icon('renown')} Renown: +${num(b.renown)}</span></div>`;
  if (b.leveled.length) body += `<div class="row"><span class="blue">⭐ Level up: ${b.leveled.map(l => `${esc(l.name)} → Lv ${l.level}`).join(', ')}</span></div>`;
  if (b.injured.length) body += `<div class="row"><span class="yellow">🩹 Injured (out ${b.recoveryTxt}, +1 mark): ${b.injured.map(esc).join(', ')}</span></div>`;
  if (b.fallen.length) body += `<div class="row"><span class="red">${icon('fallen', 14)} Fallen — lost forever: ${b.fallen.map(esc).join(', ')}</span></div>`;
  if (!b.injured.length && !b.fallen.length) body += `<div class="row"><span class="green">🛡 Everyone came home unharmed.</span></div>`;
  (b.relicEvents || []).forEach(ev => body += `<div class="row"><span class="blue">${esc(relicEventLog(ev))}</span></div>`);
  (b.relicDrops || []).forEach(d => body += `<div class="row"><span class="q-${d.tier}">🎁 Relic acquired: ${d.key ? relicIcon(d.key, 15) : d.icon} ${esc(d.name)} (${RELIC_TIERS[d.tier].name})</span></div>`);
  if (b.towerCleared) body += `<div class="row"><span class="q-mythic">🏛 Floor ${b.towerCleared} cleared — Floor ${b.towerNext} now stands open.</span></div>`;
  if (b.campaignComplete) body += `<div class="row"><span class="gold-t">🏆 Campaign complete: “${esc(b.campaignComplete)}”!${b.campaignNext ? ` “${esc(b.campaignNext)}” is now open.` : ''}</span></div>`;
  if (b.rankUp) body += `<div class="row"><span class="gold-t">🏅 New rank: “${esc(b.rankUp)}” — new tabard options may be unlocked!</span></div>`;

  return `<div id="modal-wrap" onclick="if(event.target.id==='modal-wrap')A.nextBriefing()"><div class="modal">
    <div class="sub">Mission report${b.towerCleared ? ' · the Eternal Tower' : (b.story ? ' · story' : '')}</div>
    <h2 style="margin-top:2px">${esc(b.name)}</h2>
    ${banner}
    ${body}
    <div class="spread" style="margin-top:12px">
      <span class="sub">${more > 0 ? `${more} more report${more > 1 ? 's' : ''} waiting` : ''}</span>
      <button class="act" onclick="A.nextBriefing()">${more > 0 ? 'Next report' : 'Dismiss'}</button>
    </div>
  </div></div>`;
}

// Inventory → choose which hero gets this relic
function equipRelicModal() {
  const r = state.relics.find(x => x.id === ui.equipRelic);
  if (!r) return '';
  const t = RELICS[r.key];
  const pool = livingHeroes().filter(h => h.status !== 'mission');
  return `<div id="modal-wrap" onclick="if(event.target.id==='modal-wrap')A.closeEquip()"><div class="modal">
    <h2>Equip ${relicIcon(r.key,16)} ${esc(t.name)}</h2>
    <div class="ability" style="margin-bottom:10px"><span class="q-${t.tier}">${RELIC_TIERS[t.tier].name}</span> — ${relicEffectText(r.key)}</div>
    ${pool.map(h => { const cur = heroRelic(h);
      // show what the hero already holds, effects and all, so a valuable relic isn't
      // displaced blind. A swap is non-destructive — the old relic returns to inventory.
      const downgrade = cur && RELIC_TIER_ORDER.indexOf(cur.tier) > RELIC_TIER_ORDER.indexOf(r.tier);
      return `<div class="pick-row" onclick="A.doEquipToHero(${h.id})">

  </div></div>`;
}

function partyCompValid(picked, size) {
  const n = r => picked.filter(h => CLASSES[h.cls].role === r).length;
  return picked.length === size && n('tank') >= 1 && n('healer') >= 1 && n('dps') >= 2;
}

function pickerModal() {
  const { def, story } = ui.picker;
  const size = def.size || 4;
  const picked = ui.picked.map(heroById);
  const roles = { tank: [], healer: [], dps: [] };
  idleHeroes().forEach(h => roles[CLASSES[h.cls].role].push(h));
  Object.values(roles).forEach(a => a.sort((x, y) => heroRating(y) - heroRating(x)));

  // --- squad presets strip ---
  let squadsHtml = '';
  if (state.squads.length) {
    const idleIds = new Set(idleHeroes().map(h => h.id));
    squadsHtml = `<div class="row" style="margin-bottom:8px">` +
      state.squads.map(sq => {
        const ready = sq.heroIds.filter(id => idleIds.has(id)).length;
        return `<span class="row" style="gap:2px">
          <button class="subtab" onclick="A.loadSquad(${sq.id})">${esc(sq.name)} <span class="sub">(${ready}/${sq.heroIds.length} ready)</span></button>
          <button class="ghost" style="padding:3px 8px" title="Delete squad" onclick="event.stopPropagation(); A.deleteSquad(${sq.id})">✕</button>
        </span>`;
      }).join('') +
      `</div>`;
  }
  if (ui.squadNote) squadsHtml += `<div class="sub" style="margin-bottom:8px">${esc(ui.squadNote)}</div>`;
  const squadMaxed = state.squads.length >= CFG.MAX_SQUADS;
  if (ui.picked.length) {
    squadsHtml += `<div class="row" style="margin-bottom:12px">
      <button class="ghost" ${squadMaxed ? 'disabled' : ''} onclick="A.saveSquad()">💾 Save current party</button>
      ${squadMaxed ? `<span class="sub">Max ${CFG.MAX_SQUADS} saved squads — delete one to save another.</span>` : ''}
    </div>`;
  }

  const min = { tank: 1, healer: 1, dps: 2 };
  let rows = '';
  ['tank', 'healer', 'dps'].forEach(role => {
    const have = picked.filter(h => CLASSES[h.cls].role === role).length;
    const ok = have >= min[role];
    rows += `<h3>${ROLE_ICON[role]} ${ROLE_NAME[role]} <span class="sub ${ok ? 'green' : ''}">${have} picked (need ≥${min[role]})</span></h3>`;
    if (!roles[role].length) rows += '<div class="empty">No one available.</div>';
    roles[role].forEach(h => {
      const sel = ui.picked.includes(h.id);
      rows += `<div class="pick-row ${sel ? 'sel' : ''}" onclick="A.togglePick(${h.id})">
        <span class="nm"><b>${esc(h.name)}</b> <span class="sub">Lv ${h.level} ${h.cls} · Rating <b class="rating">${num(heroRating(h))}</b></span> · ${potentialBadge(h)}
        ${powerLineHtml(h)}
        ${traitTags(h) ? `<div style="margin-top:2px">${traitTags(h)}</div>` : ''}
        ${specTags(h) ? `<div style="margin-top:2px">${specTags(h)}</div>` : ''}
        ${relicCompactHtml(h)}</span>
        ${h.marks === CFG.MAX_MARKS - 1 ? '<span class="red" title="One more injury kills this hero">⚠ 2 marks</span>' : marksHtml(h)}
      </div>`;
    });
  });

  let preview = '';
  if (picked.length) {
    const r = partyRating(picked);
    let inner = `<div class="row"><span>Party rating: <b class="rating">${num(r)}</b> vs CR <b>${num(def.cr)}</b> · ${picked.length}/${size} picked</span></div>`;
    if (partyCompValid(picked, size)) {
      const sc = successChance(picked, def.cr);
      const dur = missionDurationMs(def.hours, picked);
      const injS = picked.map(h => injuryChance(picked, h, def.cr, false));
      const injF = picked.map(h => injuryChance(picked, h, def.cr, true));
      const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
      inner += `
        <div class="row"><span>Success chance: <b class="${chanceClass(sc)}">${pct(sc)}</b></span>
        <span>Duration: <b>${fmtDur(dur)}</b></span></div>
        <div class="row sub"><span>Injury risk per hero: ~${pct(avg(injS))} on success, ~${pct(avg(injF))} on failure</span></div>
        <div class="row sub"><span>Reward: ~${num(missionGoldReward(def.cr, !!story, picked, true))}g · ~${num(missionXpReward(def.cr, !!story, picked, representativeHero(picked), true))} XP each (partial on failure)</span></div>
        ${(() => { const rl = picked.map(heroRelic).filter(Boolean); return rl.length ? `<div class="row sub"><span>Relics in play: ${rl.map(r => `<span class="q-${r.tier}">${relicIcon(r.key,14)} ${esc(RELICS[r.key].name)}</span>`).join(', ')}</span></div>` : ''; })()}`;
    } else if (picked.length < size) {
      inner += `<div class="sub">Pick ${size - picked.length} more…</div>`;
    } else {
      inner += `<div class="sub red">Party needs at least 1 tank, 1 healer, and 2 DPS.</div>`;
    }
    preview = `<div class="preview">${inner}</div>`;
  }

  const ready = partyCompValid(picked, size);
  return `<div id="modal-wrap" onclick="if(event.target.id==='modal-wrap')A.closePicker()"><div class="modal">
    <h2>Assemble party — ${esc(def.name)}</h2>
    <div class="sub">CR ${num(def.cr)} · base ${fmtHours(def.hours)} · party of ${size}${size > 4 ? ` (+${Math.round((size - 4) * CFG.PARTY_SIZE_REWARD_BONUS * 100)}% rewards)` : ''}${story && story.tower != null ? ' · the Eternal Tower' : (story ? ' · story mission' : ' · repeatable')}</div>
    <div class="flavor">${esc(def.flavor)}</div>
    ${squadsHtml}
    ${rows}
    ${preview}
    <div class="spread" style="margin-top:12px">
      <button class="ghost" onclick="A.closePicker()">Cancel</button>
      <button class="act" ${ready ? '' : 'disabled'} onclick="A.confirmParty()">⚔ Venture forth!</button>
    </div>
  </div></div>`;
}

/* =====================================================================
 *  ACTION DISPATCH (called from inline handlers)
 * ===================================================================== */
const A = {
  setView,
  toggleDrawer() { ui.drawer = !ui.drawer; renderDrawer(); },
  closeAway() { ui.awayMsgs = null; renderModal(); },

  // --- guild naming ---
  openRename() { ui.naming = 'rename'; ui._guildSuggestion = state.guildName; renderModal(); },
  closeNaming() { ui.naming = null; delete ui._guildSuggestion; renderModal(); },
  rollGuildName() {
    const name = genGuildName();
    ui._guildSuggestion = name;
    const el = $('guildNameInput');
    if (el) { el.value = name; el.focus(); }
  },
  confirmGuildName() {
    const el = $('guildNameInput');
    const val = el ? el.value : (ui._guildSuggestion || '');
    if (ui.naming === 'rename') { if (!renameGuild(val)) return; }
    else foundGuild(val);
    ui.naming = null; delete ui._guildSuggestion;
    render();
  },

  // --- mission briefings ---
  nextBriefing() { state.briefings.shift(); save(); render(); },

  // --- dismiss a hero ---
  askDismiss(id) { ui.confirmDismiss = id; renderModal(); },
  cancelDismiss() { ui.confirmDismiss = null; renderModal(); },
  confirmDismissHero() { const id = ui.confirmDismiss; ui.confirmDismiss = null; dismissHero(id); render(); },

  // --- reset all data ---
  askReset() { ui.confirmReset = true; renderModal(); },
  cancelReset() { ui.confirmReset = false; renderModal(); },
  doReset() {
    ui.confirmReset = false;
    try { window.removeEventListener('beforeunload', save); } catch (e) { /* ignore */ }
    try { localStorage.removeItem(CFG.SAVE_KEY); } catch (e) { /* ignore */ }
    location.reload(); // boot() starts a fresh game and prompts for a new guild name
  },

  // --- backup & restore ---
  openData() { ui.dataModal = true; renderModal(); },
  closeData() { ui.dataModal = false; renderModal(); },
  openCodex() { ui.codexModal = true; renderModal(); },
  closeCodex() { ui.codexModal = false; renderModal(); },
  exportDownload() {
    const data = exportSaveText();
    try {
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `lfg-save-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setStatus('exportStatus', 'Saved to your downloads.');
    } catch (e) { setStatus('exportStatus', 'Download blocked — copy the text instead.', true); }
  },
  async exportCopy() {
    const data = exportSaveText();
    try {
      await navigator.clipboard.writeText(data);
      setStatus('exportStatus', 'Copied to clipboard.');
    } catch (e) {
      const el = $('exportText'); if (el) { el.focus(); el.select(); }
      setStatus('exportStatus', 'Press Ctrl/Cmd+C to copy the selected text.', true);
    }
  },
  importFile(ev) {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { const el = $('importText'); if (el) el.value = reader.result; setStatus('importStatus', 'File loaded — press “Load this save”.'); };
    reader.onerror = () => setStatus('importStatus', 'Could not read that file.', true);
    reader.readAsText(file);
  },
  importFromText() {
    const el = $('importText');
    const text = el ? el.value.trim() : '';
    if (!text) { setStatus('importStatus', 'Paste your save text or choose a file first.', true); return; }
    const res = applyImport(text);
    if (res.ok) { ui.dataModal = false; render(); }
    else setStatus('importStatus', res.msg, true);
  },

  // --- relics: shop, equip, inventory ---
  buyRelic(i) {
    const entry = state.shop.relics[i];
    if (!entry || state.gold < entry.price) return;
    state.gold -= entry.price;
    state.relics.push(makeRelic(entry.key));
    rec('relics');
    state.shop.relics.splice(i, 1);

/* =====================================================================
 *  TICK LOOP
 * ===================================================================== */
let tickCount = 0;
function tick() {
  const now = Date.now();
  // fast countdown updates without a full re-render
  document.querySelectorAll('[data-cd]').forEach(el => {
    el.textContent = fmtDur(Number(el.dataset.cd) - now);
  });
  document.querySelectorAll('[data-income]').forEach(el => { el.textContent = num(accruedIncome(now)); });
  // don't re-render (and wipe an open text field) while a modal with inputs is up
  const blockRender = !!ui.naming || ui.dataModal;
  let dirty = false;
  if (pendingEvents(now).length) { processEvents(now); dirty = true; }   // resolve missions/training/rest; queues briefings
  if (autoRefreshRecruits(now)) { save(); dirty = true; }                 // 12–18h hire board reshuffle
  if (autoRefreshShop(now)) { save(); dirty = true; }                     // 12–24h Reliquary restock
  if (state.jobBoard.some(j => j.expires <= now)) { refreshJobBoard(now); save(); dirty = true; }
  if (dirty && !blockRender) render();
  if (++tickCount % 20 === 0) save();
}
